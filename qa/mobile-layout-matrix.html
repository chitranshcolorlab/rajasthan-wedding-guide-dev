>
const cases=[{"slug":"dev-compression-test-not-a-real-vendor-didwana","name":"Logo and compressed photos","width":320,"value":"dev-compression-test-not-a-real-vendor-didwana|320"},{"slug":"dev-compression-test-not-a-real-vendor-didwana","name":"Logo and compressed photos","width":390,"value":"dev-compression-test-not-a-real-vendor-didwana|390"},{"slug":"dev-compression-test-not-a-real-vendor-didwana","name":"Logo and compressed photos","width":768,"value":"dev-compression-test-not-a-real-vendor-didwana|768"},{"slug":"dev-ten-photo-test-not-a-real-vendor-didwana","name":"Ten-photo gallery","width":320,"value":"dev-ten-photo-test-not-a-real-vendor-didwana|320"},{"slug":"dev-ten-photo-test-not-a-real-vendor-didwana","name":"Ten-photo gallery","width":390,"value":"dev-ten-photo-test-not-a-real-vendor-didwana|390"},{"slug":"dev-ten-photo-test-not-a-real-vendor-didwana","name":"Ten-photo gallery","width":768,"value":"dev-ten-photo-test-not-a-real-vendor-didwana|768"},{"slug":"dev-optional-fields-20261006-not-a-real-vendor-didwana","name":"Long optional fields","width":320,"value":"dev-optional-fields-20261006-not-a-real-vendor-didwana|320"},{"slug":"dev-optional-fields-20261006-not-a-real-vendor-didwana","name":"Long optional fields","width":390,"value":"dev-optional-fields-20261006-not-a-real-vendor-didwana|390"},{"slug":"dev-optional-fields-20261006-not-a-real-vendor-didwana","name":"Long optional fields","width":768,"value":"dev-optional-fields-20261006-not-a-real-vendor-didwana|768"}],selection=document.getElementById('case'),preview=document.getElementById('preview');
