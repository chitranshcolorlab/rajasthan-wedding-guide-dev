name: Generate Rajasthan SEO Pages
on:
  push:
    paths:
      - 'scripts/generate-seo.js'
      - '.github/workflows/seo-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate district city category SEO pages
        run: node scripts/generate-seo.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rajasthan sitemap-seo.xml robots-dev.txt legacy-seo-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate statewide Rajasthan SEO pages"
          git push
