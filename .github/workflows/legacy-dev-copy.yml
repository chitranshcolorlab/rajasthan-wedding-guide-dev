name: Copy pinned legacy profiles into DEV
on:
  workflow_dispatch:
  push:
    branches: [dev/automatic-vendor-system]
    paths: ['scripts/copy-legacy-dev.py', '.github/workflows/legacy-dev-copy.yml']
permissions:
  contents: write
concurrency:
  group: dev-vendor-publisher
  cancel-in-progress: false
jobs:
  copy:
    if: github.repository == 'chitranshcolorlab/rajasthan-wedding-guide-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/automatic-vendor-system
      - uses: actions/checkout@v4
        with:
          repository: chitranshcolorlab/rajasthan-wedding-guide
          ref: 75e87651d36d41ce7f53d7158e0a10e99f162eae
          path: .legacy-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chitransh-color-lab.html
            /fashion-flavour-didwana.html
            /madan-mohan-resort.html
            /anchor-harshita-shekhawat.html
            /rajasthan/didwana-kuchaman/didwana/photographers-films/chitransh-color-lab/index.html
            /rajasthan/didwana-kuchaman/didwana/wedding-rental-dresses/fashion-flavour/index.html
            /rajasthan/didwana-kuchaman/didwana/wedding-venues/madan-mohan-resort/index.html
            /fashion-flavour-01.webp
            /fashion-flavour-02.webp
            /fashion-flavour-03.webp
            /fashion-flavour-04.webp
            /fashion-flavour-05.webp
            /madan_mohan_05.webp
            /AAAA.mp4
            /madan_mohan_06.webp
            /madan_mohan_04.webp
            /madan_mohan_01.webp
            /madan_mohan_02.webp
            /madan_mohan_03.webp
            /madan_mohan_07.webp
            /madan_mohan_08.webp
            /madan_mohan_09.webp
            /harshita-06.webp
            /harshita-01.webp
            /harshita-02.webp
            /harshita-03.webp
            /harshita-04.webp
            /harshita-05.webp
            /harshita-07.webp
            /harshita-08.webp
            /hosting-01-poster.webp
            /hosting-01.mp4
            /hosting-02-poster.webp
            /hosting-02.mp4
            /hosting-03-poster.webp
            /hosting-03.mp4
            /hosting-04-poster.webp
            /hosting-04.mp4
            /hosting-05-poster.webp
            /hosting-05.mp4
            /hosting-06-poster.webp
            /hosting-06.mp4
            /hosting-07-poster.webp
            /hosting-07.mp4
            /hosting-08-poster.webp
            /hosting-08.mp4
            /hosting-09-poster.webp
            /hosting-09.mp4
      - run: python3 scripts/copy-legacy-dev.py
      - name: Commit DEV legacy copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chitransh-color-lab.html fashion-flavour-didwana.html madan-mohan-resort.html anchor-harshita-shekhawat.html rajasthan/didwana-kuchaman/didwana/photographers-films/chitransh-color-lab/index.html rajasthan/didwana-kuchaman/didwana/wedding-rental-dresses/fashion-flavour/index.html rajasthan/didwana-kuchaman/didwana/wedding-venues/madan-mohan-resort/index.html fashion-flavour-01.webp fashion-flavour-02.webp fashion-flavour-03.webp fashion-flavour-04.webp fashion-flavour-05.webp madan_mohan_05.webp AAAA.mp4 madan_mohan_06.webp madan_mohan_04.webp madan_mohan_01.webp madan_mohan_02.webp madan_mohan_03.webp madan_mohan_07.webp madan_mohan_08.webp madan_mohan_09.webp harshita-06.webp harshita-01.webp harshita-02.webp harshita-03.webp harshita-04.webp harshita-05.webp harshita-07.webp harshita-08.webp hosting-01-poster.webp hosting-01.mp4 hosting-02-poster.webp hosting-02.mp4 hosting-03-poster.webp hosting-03.mp4 hosting-04-poster.webp hosting-04.mp4 hosting-05-poster.webp hosting-05.mp4 hosting-06-poster.webp hosting-06.mp4 hosting-07-poster.webp hosting-07.mp4 hosting-08-poster.webp hosting-08.mp4 hosting-09-poster.webp hosting-09.mp4 qa/legacy-copy-manifest.json
